[project]
name = "sqlite-client"
version = "0.1.0"
description = "A PyQt6-based SQLite database client"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PyQt6 >= 6.5",
    "dotenv>=0.9.9",
    "langchain >= 0.3",
    "langchain-community>=0.3",
    "langchain-huggingface>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8",
    "pytest-qt >= 4",
]
